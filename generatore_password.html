<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="generatore_password.css">
        <title>Generatore di Password</title>
    </head>
    <body>
        <h1 class="text">GENERATORE PASSWORD COMPLESSE</h1>
    <div class="container">
        <div id="options">
            <label for="lunghezza" class="text">lunghezza</label>
            <input type="number" id="lunghezza" min="5" max="50">
        </div>
        <div id="options">
            <label for="caratteri-minuscoli" class="text">Caratteri Minuscoli</label>
            <input type="checkbox" id="caratteri-minuscoli" checked>
        </div>
        <div id="options">
            <label for="caratteri-maiuscoli" class="text">Caratteri Maiuscoli</label>
            <input type="checkbox" id="caratteri-maiuscoli" checked>
        </div>
        <div id="options">
            <label for="caratteri-numerici" class="text">Caratteri Numerici</label>
            <input type="checkbox" id="caratteri-numerici" checked>
        </div>
        <div id="options">
            <label for="caratteri-speciali" class="text">Caratteri Speciali</label>
            <input type="checkbox" id="caratteri-speciali" checked>
        </div>
        
            <button id="genera-btn">Genera Password</button>
        <div id="risultato-div"></div>
    </div>
  

    <script>
        const lunghezzaPassword = document.getElementById("lunghezza");
        const caratteriMinuscoli = document.getElementById("caratteri-minuscoli");
        const caratteriMaiuscoli = document.getElementById("caratteri-maiuscoli");
        const caratteriNumerici = document.getElementById("caratteri-numerici");
        const caratteriSpeciali = document.getElementById("caratteri-speciali");
        const generaBtn = document.getElementById("genera-btn");
        const risultatoDiv = document.getElementById("risultato-div");

        const listaCaratteriMinuscoli = "abcdefghijklmnopqrstuvwxyz";
        const listaCaratteriMaiuscoli = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        const listaCaratteriNumerici = "0123456789";
        const listaCaratteriSpeciali = "<>@#][{}§°ç^?=()/&%$£!|/"

        generaBtn.addEventListener("click", generaPassword);

        function generaPassword() {
            let caratteriDisponibili = "";

            if (caratteriMinuscoli.checked) caratteriDisponibili += listaCaratteriMinuscoli;
            if (caratteriMaiuscoli.checked) caratteriDisponibili += listaCaratteriMaiuscoli;
            if (caratteriNumerici.checked)  caratteriDisponibili += listaCaratteriNumerici;
            if (caratteriSpeciali.checked)  caratteriDisponibili += listaCaratteriSpeciali;

            // Controllo: almeno un tipo di carattere deve essere selezionato
            if (caratteriDisponibili === "") {
                risultatoDiv.classList.add("errore");
                risultatoDiv.textContent = "Seleziona almeno un tipo di carattere!";
                return;
            }

            risultatoDiv.classList.remove("errore");

            const lunghezza = parseInt(lunghezzaPassword.value) || 16;
            if (lunghezza < 4 || lunghezza > 64) {
                risultatoDiv.classList.add("errore");
                risultatoDiv.textContent = "La lunghezza deve essere tra 4 e 64";
                return;
            }

            let passwordFinale = "";
            for (let i = 0; i < lunghezza; i++) {
                const indice = Math.floor(Math.random() * caratteriDisponibili.length);
                passwordFinale += caratteriDisponibili[indice];
            }

            avviaScramble(passwordFinale, caratteriDisponibili);
        }

        function avviaScramble(passwordFinale, caratteriDisponibili) {
            const lunghezza = passwordFinale.length;
            let step = 0;                    
            const velocita = 35;             
            const scramblePerCarattere = 4;  

            risultatoDiv.textContent = "";

            const intervallo = setInterval(() => {
                let testoVisualizzato = "";

                for (let i = 0; i < lunghezza; i++) {
                    if (i < step) {
                        testoVisualizzato += passwordFinale[i];
                    } else {
                        const randomIndex = Math.floor(Math.random() * caratteriDisponibili.length);
                        testoVisualizzato += caratteriDisponibili[randomIndex];
                    }
                }

                risultatoDiv.textContent = testoVisualizzato;

                if (Math.random() < 0.35 || step === 0) {   
                    step++;
                }

                if (step > lunghezza) {
                    clearInterval(intervallo);
                    risultatoDiv.textContent = passwordFinale; 
                }
            }, velocita);
        }
       
    
    </script>
    </body>
</html>
